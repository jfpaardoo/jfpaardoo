<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#131c2e" />
    </linearGradient>

    <radialGradient id="glowLime" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 70) rotate(135) scale(420 260)">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 260) rotate(25) scale(380 220)">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="glassCard" x1="60" y1="36" x2="1220" y2="284" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="glassBorder" x1="60" y1="36" x2="1220" y2="284" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0.30" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Fondo base y cuadrícula sutil -->
  <rect width="1280" height="320" rx="20" fill="url(#bgGrad)" />
  <rect width="1280" height="320" rx="20" fill="url(#grid)" />

  <!-- Orbes luminosos -->
  <rect width="1280" height="320" rx="20" fill="url(#glowLime)" />
  <rect width="1280" height="320" rx="20" fill="url(#glowBlue)" />

  <!-- Tarjeta principal Glassmorphism -->
  <rect x="48" y="34" width="1184" height="252" rx="18" fill="url(#glassCard)" stroke="url(#glassBorder)" stroke-width="1.5" />

  <!-- Acento lateral izquierdo -->
  <rect x="84" y="76" width="5" height="168" rx="2.5" fill="#a3e635" />

  <!-- Etiqueta superior -->
  <rect x="112" y="74" width="275" height="28" rx="14" fill="#a3e635" fill-opacity="0.14" stroke="#a3e635" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="129" cy="88" r="4.5" fill="#a3e635" />
  <text x="142" y="93" fill="#bef264" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="0.8">ETSII · UNIVERSIDAD DE SEVILLA</text>

  <!-- Nombre principal -->
  <text x="112" y="152" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Juan Felipe Pardo Carrillo</text>

  <!-- Subtítulo profesional -->
  <text x="112" y="190" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="400">Software Engineering · Full-Stack Architecture & Applied AI</text>

  <!-- Píldoras tecnológicas -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">
    <rect x="112" y="214" width="126" height="28" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="175" y="232" fill="#a3e635" text-anchor="middle">Spring Boot</text>

    <rect x="248" y="214" width="128" height="28" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="312" y="232" fill="#e2e8f0" text-anchor="middle">React & TS</text>

    <rect x="386" y="214" width="122" height="28" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="447" y="232" fill="#a3e635" text-anchor="middle">Python & AI</text>

    <rect x="518" y="214" width="136" height="28" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="586" y="232" fill="#e2e8f0" text-anchor="middle">DevOps & CI/CD</text>
  </g>

  <!-- Bloque decorativo derecho tipo terminal/código -->
  <rect x="920" y="74" width="276" height="170" rx="14" fill="#090d16" fill-opacity="0.65" stroke="#334155" stroke-width="1" />
  <circle cx="942" cy="94" r="5" fill="#ef4444" fill-opacity="0.8" />
  <circle cx="958" cy="94" r="5" fill="#f59e0b" fill-opacity="0.8" />
  <circle cx="974" cy="94" r="5" fill="#a3e635" fill-opacity="0.9" />

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
    <text x="940" y="126" fill="#94a3b8">const <tspan fill="#a3e635">engineer</tspan> = {</text>
    <text x="956" y="148" fill="#cbd5e1">role: <tspan fill="#7dd3fc">'Software Eng.'</tspan>,</text>
    <text x="956" y="170" fill="#cbd5e1">focus: [<tspan fill="#7dd3fc">'Web'</tspan>, <tspan fill="#7dd3fc">'LLMs'</tspan>],</text>
    <text x="956" y="192" fill="#cbd5e1">location: <tspan fill="#7dd3fc">'Seville, ES'</tspan></text>
    <text x="940" y="214" fill="#94a3b8">};</text>
  </g>
</svg>
